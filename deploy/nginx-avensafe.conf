# nginx reverse proxy → PM2 standalone Next.js on 127.0.0.1:3006
# Install: sudo cp deploy/nginx-avensafe.conf /etc/nginx/sites-available/avensafe
#          sudo ln -s /etc/nginx/sites-available/avensafe /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# TLS: certbot --nginx -d avensafesolutions.com -d www.avensafesolutions.com

upstream avensafe_next {
    server 127.0.0.1:3006;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name avensafesolutions.com www.avensafesolutions.com;

    # Uncomment after certbot:
    # return 301 https://$host$request_uri;

    client_max_body_size 8m;

    location /_next/static/ {
        proxy_pass http://avensafe_next;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://avensafe_next;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

